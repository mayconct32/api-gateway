[project]
name = "payment"
version = "0.2.0"
description = "E-commerce FastAPI com pagamentos Stripe e Razorpay"
authors = [
    {name = "mayconct32",email = "maycon326754@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.122,<1.0)",
    "uvicorn (>=0.40,<1.0)",
    "pydantic (>=2.12,<3.0)",
    "pydantic-settings (>=2.12,<3.0)",
    "email-validator (>=2.3,<3.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "stripe (>=13.0,<14.0)",
    "razorpay (>=2.0,<3.0)",
    "pyjwt (>=2.10,<3.0)",
    "bcrypt (>=5.0,<6.0)",
    "python-multipart (>=0.0.20,<0.1)",
    "pytest (>=9.0,<10.0)",
]

[tool.poetry]
packages = [{include = "app"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
